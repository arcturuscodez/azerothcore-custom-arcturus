name: Arcturus custom tests
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Python contract tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Run Arcturus tests
        run: python tests/arcturus/run.py
