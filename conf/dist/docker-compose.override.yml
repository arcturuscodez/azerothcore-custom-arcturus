version: "3.8"
#
# Copy to repo root as docker-compose.override.yml (Compose auto-merges it),
# or:  cp conf/dist/docker-compose.override.yml docker-compose.override.yml
#
# Do not commit secrets / live GUIDs here — keep those in gitignored env/dist/etc.
#

services:
  ac-worldserver:
    environment:
      # Apply pending_db_* SQL on worldserver startup (auth|characters|world bitmask = 7).
      AC_UPDATES_ENABLE_DATABASES: "7"
      # Rate.XP.Kill — creature kill experience
      AC_RATE_XP_KILL: "3"
      # Silence WarlockDemonicEmpowerment missing-option spam if live worldserver.conf
      # was not merged from arcturus-recommended-overrides.conf.dist yet.
      AC_WARLOCK_DEMONIC_EMPOWERMENT_TEMPERING_SOULS_PER_TIER: "100"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_TEMPERING_MAX_TIERS: "0"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_ANNOUNCE_EVERY_NKILLS: "100"
      # mod-ollama-chat — bots talk via host Ollama (must be running on :11434)
      AC_OLLAMA_CHAT_ENABLE: "1"
      AC_OLLAMA_CHAT_URL: "http://host.docker.internal:11434/api/generate"
      AC_OLLAMA_CHAT_MODEL: "llama3.2:1b"
      AC_OLLAMA_CHAT_ENABLE_RANDOM_CHATTER: "1"
      AC_OLLAMA_CHAT_ENABLE_EVENT_CHATTER: "1"
      AC_OLLAMA_CHAT_ENABLE_GUILD_RANDOM_AMBIENT_CHATTER: "1"
      AC_OLLAMA_CHAT_ENABLE_WHISPER_REPLIES: "1"
