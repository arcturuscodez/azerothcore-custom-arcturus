version: "3.8"
#
# Copy to repo root as docker-compose.override.yml (Compose auto-merges it),
# or:  cp conf/dist/docker-compose.override.yml docker-compose.override.yml
#
# Do not commit secrets / live GUIDs here — keep those in gitignored env/dist/etc.
#

services:
  # In-compose Ollama — worldserver talks to http://ac-ollama:11434 (not host.docker.internal).
  # Pull a small model once: docker compose exec ac-ollama ollama pull llama3.2:1b
  ac-ollama:
    image: ollama/ollama:latest
    container_name: ac-ollama
    networks:
      - ac-network
    volumes:
      - ${DOCKER_VOL_OLLAMA:-ac-ollama}:/root/.ollama
    restart: unless-stopped
    # Optional GPU (Docker Desktop / NVIDIA): uncomment when available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  ac-worldserver:
    depends_on:
      - ac-ollama
    environment:
      # Apply pending_db_* SQL on worldserver startup (auth|characters|world bitmask = 7).
      AC_UPDATES_ENABLE_DATABASES: "7"
      # Rate.XP.Kill — creature kill experience
      AC_RATE_XP_KILL: "3"
      # All primary professions learnable from trainers (0-11)
      AC_MAX_PRIMARY_TRADE_SKILL: "11"
      AC_ARCTURUS_WARLOCK_WEAPON_TRAINERS_ENABLE: "1"
      # Silence WarlockDemonicEmpowerment missing-option spam if live worldserver.conf
      # was not merged from arcturus-recommended-overrides.conf.dist yet.
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_STAMINA: "0.2"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_STRENGTH: "0.1"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_AGILITY: "0.1"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_INTELLECT: "0.1"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_SPIRIT: "0.1"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_ATTACK_POWER: "0.1"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_SPELL_POWER: "0.05"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_ARMOR: "0.5"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_PER_KILL_MAX_SOULS_APPLIED: "10000"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_TEMPERING_SOULS_PER_TIER: "100"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_TEMPERING_MAX_TIERS: "0"
      AC_WARLOCK_DEMONIC_EMPOWERMENT_ANNOUNCE_EVERY_NKILLS: "100"
      # mod-ollama-chat — talk to compose service ac-ollama (budgeted defaults)
      AC_OLLAMA_CHAT_ENABLE: "1"
      AC_OLLAMA_CHAT_URL: "http://ac-ollama:11434/api/generate"
      AC_OLLAMA_CHAT_MODEL: "llama3.2:1b"
      AC_OLLAMA_CHAT_NUM_PREDICT: "40"
      AC_OLLAMA_CHAT_MAX_CONCURRENT_QUERIES: "2"
      AC_OLLAMA_CHAT_DEBUG_ENABLED: "0"
      AC_OLLAMA_CHAT_ENABLE_RANDOM_CHATTER: "1"
      AC_OLLAMA_CHAT_ENABLE_EVENT_CHATTER: "0"
      AC_OLLAMA_CHAT_ENABLE_GUILD_RANDOM_AMBIENT_CHATTER: "0"
      AC_OLLAMA_CHAT_ENABLE_WHISPER_REPLIES: "1"
      AC_OLLAMA_CHAT_MIN_RANDOM_INTERVAL: "90"
      AC_OLLAMA_CHAT_MAX_RANDOM_INTERVAL: "180"
      AC_OLLAMA_CHAT_RANDOM_CHATTER_REAL_PLAYER_DISTANCE: "40"

volumes:
  ac-ollama:
